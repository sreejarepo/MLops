global:
  scrape_interval: 15s

scrape_configs:
  # Service name + container port: works inside the compose network.
  # (host.docker.internal:8000 would hit the wrong port; compose publishes the API on 8002.)
  - job_name: heart-disease-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["heart-disease-api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
