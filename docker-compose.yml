services:
  heart-disease-api:
    build: .
    ports:
      - "8002:8000"
    environment:
      MODEL_PATH: /app/models/heart_disease_model.joblib
      MODEL_VERSION: "1.0.0"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - heart-disease-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
